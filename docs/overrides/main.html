{% extends "base.html" %}

{% block extrahead %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% endblock %}

{% block site_meta %}
{% if page and page.meta and page.meta.seo_html %}
{{ page.meta.seo_html | safe }}
{% else %}
{{ super() }}
{% endif %}
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
(function() {
  var drawer = document.getElementById('__drawer');
  if (drawer) {
    drawer.addEventListener('change', function() {
      document.body.classList.toggle('drawer-open', this.checked);
    });
    document.addEventListener('click', function(e) {
      var link = e.target.closest('.md-sidebar--primary .md-nav__link');
      if (link && drawer.checked) {
        drawer.checked = false;
        document.body.classList.remove('drawer-open');
      }
    });
  }
})();
</script>
<script>
(function() {
  function showBanner(scheme) {
    document.querySelectorAll('.banner-light').forEach(function(el) {
      el.style.display = scheme === 'slate' ? 'none' : '';
    });
    document.querySelectorAll('.banner-dark').forEach(function(el) {
      el.style.display = scheme === 'default' ? 'none' : '';
    });
  }
  var target = document.body;
  if (target) {
    showBanner(target.getAttribute('data-md-color-scheme'));
    var observer = new MutationObserver(function() {
      showBanner(target.getAttribute('data-md-color-scheme'));
    });
    observer.observe(target, { attributes: true, attributeFilter: ['data-md-color-scheme'] });
  }
})();
</script>
{% endblock %}
