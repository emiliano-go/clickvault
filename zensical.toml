[project]
site_name = "ClickVault Documentation"
site_description = "ClickVault: a HashiCorp Vault database secrets engine plugin for ClickHouse. Dynamic credentials, static role rotation, and cluster-aware DDL management."
site_url = "https://clickvault.emiliano-go.com"
docs_dir = "docs"
site_dir = "site"

copyright = "&copy; 2026 Emiliano Gandini Outeda"

[project.theme]
variant = "modern"
custom_dir = "docs/overrides"
favicon = "assets/images/og-image.png"

font.text = "Ubuntu"
font.code = "JetBrains Mono"

features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tabs",
    "navigation.indexes",
    "navigation.top",
    "navigation.footer",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/emiliano-go/clickvault"
name = "ClickVault on GitHub"

[[project.nav]]
"Overview" = "index.md"

[[project.nav]]
"Quick Start" = "quick-start.md"

[[project.nav]]
Configuration = "configuration.md"

[[project.nav]]
Roles = "roles.md"

[[project.nav]]
Architecture = "architecture.md"

[[project.nav]]
Development = "development.md"

[[project.nav]]
"Glossary" = "glossary.md"

[project.markdown_extensions.tables]

[project.markdown_extensions.admonition]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]
